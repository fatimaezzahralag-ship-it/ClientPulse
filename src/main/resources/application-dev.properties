# Profil "dev" : ./mvnw spring-boot:run "-Dspring-boot.run.profiles=dev"
# Charge en plus les données de démonstration (dossier db/dev, géré par P3 : peut ne pas exister encore).
spring.flyway.locations=classpath:db/migration,classpath:db/dev

# Voir les requêtes SQL pendant le développement
spring.jpa.show-sql=true
logging.level.ma.ensam.clientpulse=DEBUG
