# =============================================================================
# Profil dev : spring.profiles.active=dev  (ou SPRING_PROFILES_ACTIVE=dev)
#
# - charge les données de démonstration (db/dev/V100__demo_data.sql) en plus des migrations
# - active Swagger UI : http://localhost:8080/swagger-ui.html
# =============================================================================

spring.flyway.locations=classpath:db/migration,classpath:db/dev

springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true

logging.level.ma.ensam.clientpulse=DEBUG
