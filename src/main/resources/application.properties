spring.application.name=ClientPulse

# Base de données MySQL
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/clientpulse?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}

# JPA / Hibernate
# validate : Hibernate ne crée plus ni ne modifie les tables. Il vérifie au
# démarrage que les entités correspondent exactement au schéma créé par Flyway.
# Un écart (colonne manquante, type différent) fait échouer le démarrage.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true

# Ne jamais exposer les traces techniques dans les réponses HTTP
server.error.include-message=never
server.error.include-stacktrace=never

# Flyway - le schéma est versionné par db/migration (V1__init.sql, V2__roles.sql).
# Actif par défaut. Flyway exécute les migrations puis Hibernate les valide.
# baseline-on-migrate : une base déjà créée par Hibernate (ddl-auto=update) est
# marquée à la version 1 au lieu d'échouer sur un schéma non vide.
spring.flyway.enabled=${FLYWAY_ENABLED:true}
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

# Données d'amorçage (rôles + comptes de démonstration)
app.seed.enabled=${APP_SEED_ENABLED:true}
app.seed.admin.email=${APP_SEED_ADMIN_EMAIL:admin@clientpulse.ma}
app.seed.admin.password=${APP_SEED_ADMIN_PASSWORD:Admin@12345}
app.seed.commercial.email=${APP_SEED_COMMERCIAL_EMAIL:commercial@clientpulse.ma}
app.seed.commercial.password=${APP_SEED_COMMERCIAL_PASSWORD:Commercial@12345}

# Job nocturne de scoring (J4). Horaire proposé : 2 h du matin.
app.scoring.cron=${SCORING_CRON:0 0 2 * * *}
app.scoring.relances.enabled=${SCORING_RELANCES_ENABLED:true}
