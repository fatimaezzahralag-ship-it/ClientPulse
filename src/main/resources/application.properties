spring.application.name=ClientPulse

# Base de données : les valeurs par défaut conviennent pour MySQL en local.
# Pour changer sans toucher au fichier : variables d'environnement DB_URL, DB_USER, DB_PASSWORD.
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/clientpulse?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:}

# Le schéma est créé par Flyway (db/migration), jamais par Hibernate.
spring.jpa.hibernate.ddl-auto=none
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# false : on ne garde pas la session JPA ouverte pendant la réponse HTTP. Le chargement LAZY se fait
# dans les services (@Transactional) qui renvoient des DTO.
spring.jpa.open-in-view=false

server.port=8080
