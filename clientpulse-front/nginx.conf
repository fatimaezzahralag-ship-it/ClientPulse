server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Les exports PDF/CSV et les imports ne doivent pas être tronqués.
    client_max_body_size 6m;

    # API : relayée vers le conteneur backend (nom de service docker-compose).
    location /api/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # Application Angular : toute route inconnue renvoie index.html (routage côté navigateur).
    location / {
        try_files $uri $uri/ /index.html;
    }
}
