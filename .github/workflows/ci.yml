name: CI

# À chaque push et pull request : tests du backend (mvn verify) puis build et tests du frontend.
on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  backend:
    name: Backend (Java 17, Maven)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Installer Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      # Docker est disponible sur ubuntu-latest : FlywaySchemaTest démarre un vrai MySQL 8.4 via Testcontainers.
      - name: mvn clean verify
        run: ./mvnw -B -ntp clean verify

      - name: Publier les rapports de tests
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rapports-tests-backend
          path: target/surefire-reports
          if-no-files-found: ignore

  frontend:
    name: Frontend (Angular)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: clientpulse-front
    steps:
      - uses: actions/checkout@v4

      - name: Installer Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: clientpulse-front/package-lock.json

      - name: Installer les dépendances
        run: npm ci

      - name: Build de production
        run: npx ng build --configuration production

      - name: Tests unitaires
        run: npx ng test --watch=false
